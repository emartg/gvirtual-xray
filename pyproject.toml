[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "scikit-build>=0.15.0",
    "cmake>=3.26",
    #"conan>=2.0.0"
    #"swig; platform_system!='Windows'",
    "numpy>=2.2",
    #"make"
    "ninja",
    "swig"
]
build-backend = "setuptools.build_meta"



[project]
name = "gvxr"
version = "2.1.0"
authors = [
  { name="Prof Franck P. Vidal" }
]
description="gVirtualXray (gVXR) Bindings to simulate realist X-ray attenuation images in microseconds from triangle meshes."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
#    #"xpecgen>=1.3.0",
#    "spekpy",
#    "scikit-image",
    "numpy",
#    "matplotlib",
#    "pillow",
#    "pytest",
#    "pandas",
    "json5"
]

classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU",
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries"
]

[project.urls]
"Homepage" = "https://gvirtualxray.sourceforge.io/"
"Bug Tracker" = "https://sourceforge.net/p/gvirtualxray/tickets/"

[tool.ruff]
line-length =  120
